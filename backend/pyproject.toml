[project]
name = "lifemanager-backend"
version = "0.1.0"
description = "Personal project, task and routine manager"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.33",
    "markdown>=3.11.3",
]

[dependency-groups]
dev = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
