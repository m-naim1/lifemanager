{% extends "base.html" %}
{% block title %}Log in · LifeManager{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16 px-4 pb-16">
  <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-soft border border-slate-200 dark:border-slate-800 p-6">
    <div class="flex items-center gap-3 mb-5">
      <span class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-sky-500 text-white">
        <i data-lucide="layout-dashboard" class="h-5 w-5"></i>
      </span>
      <div>
        <h1 class="text-xl font-bold tracking-tight">Welcome back</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400">Log in to your LifeManager.</p>
      </div>
    </div>

    <form method="post" action="/login" class="space-y-3">
      <input type="hidden" name="next" value="{{ next_url }}" />
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Email</label>
        <input name="email" type="email" required value="{{ email or '' }}" placeholder="you@example.com"
               class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Password</label>
        <input name="password" type="password" required placeholder="Password"
               class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500" />
      </div>
      {% if error %}
      <p class="text-sm text-rose-600 dark:text-rose-400">{{ error }}</p>
      {% endif %}
      <button type="submit" class="w-full py-2.5 rounded-lg bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 transition-colors">
        Log in
      </button>
    </form>

    {% if allow_signup %}
    <p class="text-sm mt-4 text-slate-500 dark:text-slate-400">
      No account?
      <a href="/register?next={{ next_url|urlencode }}" class="text-blue-600 dark:text-blue-400 font-medium hover:underline">Register</a>
    </p>
    {% endif %}
  </div>
</div>
{% endblock %}
