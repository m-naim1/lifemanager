{% extends "base.html" %}
{% block title %}Calendar · LifeManager{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
  <!-- Header -->
  <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
    <div class="flex items-center gap-4">
      <span class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-sky-100 text-sky-600 dark:bg-sky-500/15 dark:text-sky-300">
        <i data-lucide="calendar-days" class="h-[22px] w-[22px]"></i>
      </span>
      <div>
        <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100 tracking-tight">Calendar</h1>
        <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">Completions are heat-mapped per day; click a day for notes.</p>
      </div>
    </div>
  </div>

  <div id="calendar-body">
    {% include "partials/calendar_body.html" %}
  </div>
</div>
{% endblock %}
