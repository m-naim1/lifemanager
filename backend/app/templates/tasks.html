{% extends "base.html" %}
{% block title %}Tasks · LifeManager{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
  <!-- Page header -->
  <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
    <div class="flex items-center gap-4">
      <span class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-blue-100 text-blue-600 dark:bg-blue-500/15 dark:text-blue-300">
        <i data-lucide="list-todo" class="h-[22px] w-[22px]"></i>
      </span>
      <div>
        <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100 tracking-tight">Tasks</h1>
        <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">
          {{ pending_count }} pending · {{ overdue_count }} overdue across all projects.
        </p>
      </div>
    </div>
    <button type="button"
            hx-get="/tasks/new?next=/tasks" hx-target="#modal-root" hx-swap="innerHTML"
            class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-blue-600 text-white text-sm font-medium hover:bg-blue-700 shadow-brand transition-all hover:-translate-y-0.5">
      <i data-lucide="plus" class="h-4 w-4"></i>
      New Task
    </button>
  </div>

  <div id="tasks-panel">
    {% include "partials/tasks_panel.html" %}
  </div>
</div>
{% endblock %}
